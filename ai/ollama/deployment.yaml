apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      nodeSelector:
        workload: ai
      containers:
        -  name: ollama
           image: ollama/ollama:latest
           ports:
             - containerPort: 11434

           volumeMounts:
             - name: models
               mountPath: /root/.ollama

           resources:
             requests:
               cpu: "4"
               memory: 8Gi

             limits:
               cpu: "8"
               memory: 16Gi

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
