apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 79.2.0

    helm:
      valueFiles:
        - $values/monitoring/kube-prometheus-stack/values.yaml

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 79.2.0
      helm:
        valueFiles:
          - $values/monitoring/kube-prometheus-stack/values.yaml

    - repoURL: https://github.com/stranz64/gitops-platform.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
     - CreateNamespace=true
     - ServerSideApply=true
