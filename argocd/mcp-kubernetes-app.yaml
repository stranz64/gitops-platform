apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mcp-kubernetes
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/stranz64/gitops-platform.git
    targetRevision: main
    path: ai/mcp-kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: mcp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
