apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: open-webui
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/stranz64/gitops-platform.git
    targetRevision: main
    path: ai/open-webui

  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
     - CreateNamespace=true
     - ServerSideApply=true
