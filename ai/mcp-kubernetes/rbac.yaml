apiVersion: v1
kind: ServiceAccount

metadata:
  name: mcp-k8s
  namespace: mcp


---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: mcp-k8s-readonly

rules:
- apiGroups: [""]
  resources:
    - pods
    - nodes
    - namespaces
    - services
    - events
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
    - daemonsets
    - statefulsets
  verbs:
    - get
    - list
    - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: mcp-k8s-readonly

subjects:
- kind: ServiceAccount
  name: mcp-k8s
  namespace: mcp

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-k8s-readonly





