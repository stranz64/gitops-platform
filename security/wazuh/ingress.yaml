apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh
  namespace: wazuh

  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS

spec:
  ingressClassName: nginx

  tls:
  - secretName: wazuh-tls
    hosts:
      - wazuh.nj.test.lab

  rules:
  - host: wazuh.nj.test.lab

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: wazuh-dashboard
            port:
              number: 443
