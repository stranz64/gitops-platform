apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kyverno-policies
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/stranz64/gitops-platform.git
    targetRevision: HEAD
    path: security/kyverno

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

