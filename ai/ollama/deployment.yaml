apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      nodeSelector:
        workload: ai
      containers:
        -  name: ollama
           image: ollama/ollama:latest
           ports:
             - containerPort: 11434

           volumeMounts:
             - name: models
               mountPath: /root/.ollama

           resources:
             requests:
               cpu: "2"
               memory: "8Gi"

             limits:
               cpu: "6"
               memory: "16Gi"
               nvidia.com/gpu: 1

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
