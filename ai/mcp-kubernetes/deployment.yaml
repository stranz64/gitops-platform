apiVersion: apps/v1
kind: Deployment

metadata:
  name: mcp-kubernetes
  namespace: mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mcp-kubernetes


  template:
    metadata:
      labels:
        app: mcp-kubernetes

    spec:
      ServiceAccountName: mcp-k8s

      containers:
      - name: mcp-kubernetes

        image: harbor.nj.test.lab/ai/mcp-kubernetes:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        env:
        - name: PYTHONUNBUFFERED
          value: "1"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 10
          periodSeconds: 20

        readinessProbe:
          httpGet:
            path: /health
            port: 8080

          initialDelaySeconds: 5
          periodSeconds: 10



