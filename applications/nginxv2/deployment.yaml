apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginxv2
  namespace: default

spec:
  replicas: 4

  selector:
    matchLabels:
      app: nginxv2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nginxv2
    spec:
      imagePullSecrets:
        - name: harbor-pull

      containers:
        - name: nginx
          image: harbor.nj.test.lab/applications/nginx:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
