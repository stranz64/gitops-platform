apiVersion: apps/v1
kind: Deployment

metadata:
  name: mcp-kubernetes
  namespace: mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mcp-kubernetes


  template:
    metadata:
      labels:
        app: mcp-kubernetes

    spec:
      ServiceAccountName: mcp-k8s

      containers:
      - name: mcp-kubernetes

        image: mcp/kubernetes:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

