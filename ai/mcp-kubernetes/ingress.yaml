apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: mcp-kubernetes
  namespace: mcp

spec:
  ingressClassName: nginx

  tls:
  - hosts:
      - mcp.nj.test.lab
    secretName: chat-tls


  rules:
  - host: mcp.nj.test.lab

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: mcp-kubernetes
            port:
              number: 8080
