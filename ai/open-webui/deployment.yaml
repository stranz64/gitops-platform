apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: open-webui

  template:
    metadata:
      labels:
        app: open-webui


    spec:
     imagePullSecrets:
     - name: harbor-creds

     containers:
     - name: open-webui

       image: harbor.nj.test.lab/ai/open-webui:main

       imagePullPolicy: Always

       ports:
       - containerPort: 8080

       env:
       - name: ENABLE_OAUTH_SIGNUP
         value: "true"

       - name: ENABLE_LOGIN_FORM
         value: "true"

       - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
         value: "true"

       - name: OAUTH_PROVIDER_NAME
         value: "keycloak"

       - name: OPENID_PROVIDER_URL
         value: "https://keycloak.nj.test.lab/realms/nj-test-lab/.well-known/openid-configuration"

       - name: OAUTH_CLIENT_ID
         value: "open-webui"

       - name: OAUTH_CLIENT SECRET
         valueFrom:
           secretKeyRef:
             name: open-webui-oidc
             key: client-secret

       - name: OLLAMA_BASE_URL
         value: http://ollama.ai.svc.cluster.local:11434

       volumeMounts:
       - mountPath: /app/backend/data
         name: data

       resources:
         requests:
           cpu: "500m"
           memory: "1Gi"

         limits:
           cpu: "2"
           memory: "4Gi"

     volumes:
     - name: data
       persistentVolumeClaim: 
         claimName: open-webui-data
 
