apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kagent
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: kagent

  source:
    repoURL: oci://ghcr.io/kagent-dev/kagent/helm
    chart: kagent
    targetRevision: 1.0.1

    helm:
      values: |
        providers:
          default: ollama

        ollama:
          provider: ollama

          model: "qwen2.5:14b"

          config:
            host: "http://ollama.ai.svc.cluster.local:11434"

            options:
              num_ctx: "64000" 


  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
