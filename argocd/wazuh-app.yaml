apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: wazuh
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/wazuh/wazuh-kubernetes.git
    targetRevision: v4.13.1
    path: wazuh
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
     - CreateNamespace=true
     - ServerSideApply=true
