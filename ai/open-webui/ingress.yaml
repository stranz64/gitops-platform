apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui

spec:
  ingressClassName: nginx

  tls:
  - hosts:
      -  chat.nj.test.lab
    secretName: chat-tls

  rules:
  - host: chat.nj.test.lab
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: open-webui
              port:
                number: 8080


