apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: open-webui

  template:
    metadata:
      labels:
        app: open-webui


  spec:
   imagePullSecrets:
   - name: harbor-creds

   containers:
   - name: open-webui

     image: harbor.nj.test.lab/ai/open-webui:main

     imagePullPolicy: Always

     ports:
     - containerPort: 8080

     env:
     - name: OLLAMA_BASE_URL
       value: http://ollama.ai.svc.cluster.local:11434

     volumeMounts:
     - mountPath: /app/backend/data
       name: data

     resources:
       requests:
         cpu: "500m"
         memory: "1Gi"

       limits:
         cpu: "2"
         memory: "4Gi"

   volumes:
   - name: data
     persistentVolumeClaim: 
       claimName: open-webui-data
 
