apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pipelines
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/stranz64/gitops-platform.git
    targetRevision: main
    path: ai/pipelines

  destination:
    server: https://kubernetes.defailt.svc
    namespace: open-webui

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  syncOptions:
    - CreateNamespace=true
